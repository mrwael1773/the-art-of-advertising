<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المحادثة التفاعلية - صفحة 59</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#f3f5f8;color:#172033;font-family:system-ui,Tahoma,sans-serif}
main{max-width:850px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:1.2rem}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 15px;background:#155e75;color:white;cursor:pointer}.speed-control{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;padding:10px 13px;border-radius:10px;margin:10px 0 14px}.speed-control input{width:min(220px,48vw);accent-color:#155e75}.speed-control output{font-weight:800;min-width:3.5em;text-align:center}
.secondary{background:#e2e8f0;color:#172033}button:disabled{opacity:.45;cursor:not-allowed}
.page{position:relative;max-width:790px;margin:auto;background:white;line-height:0;box-shadow:0 8px 24px #0001;overflow:hidden}
.page img{width:100%;height:auto;display:block}
.hot{position:absolute;border:0;border-radius:1px;background:transparent;padding:0;min-width:0;min-height:0;cursor:pointer;opacity:1;mix-blend-mode:normal}
.hot:focus-visible{outline:2px solid #2563eb;outline-offset:1px}
.hot.selected{background:transparent}
.hot.active{background:rgba(255,220,35,.25);mix-blend-mode:multiply;box-shadow:none}
.status{max-width:790px;margin:12px auto;padding:12px;background:white;border-radius:10px;color:#475569;line-height:1.6}
.note{font-size:.88rem;color:#64748b;margin:8px 0}
</style></head>
<body><main>
<header><h1>المحادثة التفاعلية</h1><b>صفحة 59</b></header>
<div class="controls">
<button id="play">▶ استمع إلى المحادثة</button>
<button class="secondary" id="pause" disabled>إيقاف مؤقت</button>
<button class="secondary" id="stop" disabled>إيقاف</button>
</div>
<div class="speed-control"><label for="speed">سرعة الصوت</label><input id="speed" type="range" min="0.25" max="1" step="0.05" value="1"><output id="speedValue" for="speed">1.0×</output><span class="note">0.25× بطيء جدًا — 1× السرعة الطبيعية</span></div>
<audio id="omarAudio" preload="auto" src="https://resource2.heygen.ai/text_to_speech/e5985a6c5fcb4e1d9247c437a6067191/c30ecab014cb4a8d816d07f6b2b625c8/id=7184660b9fed43cfb48cb23227905644.wav"></audio>
<audio id="adnanAudio" preload="auto" src="https://resource2.heygen.ai/text_to_speech/e5985a6c5fcb4e1d9247c437a6067191/80b17a1be1594e578b92c0ddf4a37fc8/id=1961e5c548fd4cc888f3965416e7a7f7.wav"></audio>
<div class="page" id="page"><img src="conversation-page-59.jpg" alt="صفحة الكتاب الأصلية للمحادثة" onerror="document.querySelector('#status').textContent='تعذر تحميل صورة الصفحة. تحقق من الاتصال ثم أعد تحميل الموقع.'"></div>
<div class="status" id="status" aria-live="polite">اضغط زر الاستماع أو اضغط على موضع جملة في الصفحة لسماعها وحدها.</div>
<p class="note">تُستخدم تسجيلات HeyGen الطبيعية بصوتين مختلفين لعدنان وعمر.</p>
</main>
<script>
const lines=[
["Adnan","Hi, Omar. What are you up to?",[[19.1,19.25,17.0,1.35]]],
["Omar","I'm turning off my alarm.",[[19.1,20.8,16.1,1.35]]],
["Adnan","What on earth is that?",[[19.1,22.35,15.8,1.35]]],
["Omar","It's the new flying helicopter alarm. It runs on rechargeable batteries! It's the best alarm clock I've ever had.",[[19.1,23.9,41.0,1.35],[19.1,25.4,33.0,1.35]]],
["Adnan","How does it work?",[[19.1,27.55,14.8,1.35]]],
["Omar","You see, the top part, in other words the flying part, is placed on a base. The alarm is set and when it goes off the top part flies off the base. It is made to fly in order to make you get up, catch it, and put it back on its base.",[[19.1,29.1,58.0,1.35],[19.1,30.6,55.0,1.35],[19.1,32.1,50.0,1.35]]],
["Adnan","And why is it here?",[[19.1,34.0,15.4,1.35]]],
["Omar","Well, you know how it is when you have a lot to do at work and you also have to attend meetings. I don't have an assistant so if I am working on an important project I forget. The flying alarm can solve the problem. I set it in time for any meeting or conference that I have and I don't have to worry. What do you think?",[[19.1,35.55,60.0,1.35],[19.1,37.1,58.0,1.35],[19.1,38.6,56.5,1.35],[19.1,40.1,58.5,1.35],[19.1,41.6,14.8,1.35]]]
];
const $=s=>document.querySelector(s),page=$("#page"),status=$("#status"),pauseBtn=$("#pause"),stopBtn=$("#stop"),spots=[];
lines.forEach((line,i)=>{
 const group=[];
 line[2].forEach(([x,y,w,h],row)=>{
  const b=document.createElement("button");b.type="button";b.className="hot";
  b.setAttribute("aria-label",row===0?"تشغيل جملة "+(i+1)+" — "+line[0]:"السطر "+(row+1)+" من الجملة "+(i+1));
  Object.assign(b.style,{left:x+"%",top:(y+2.0)+"%",width:w+"%",height:(h*0.62)+"%"});
  b.addEventListener("click",()=>speak(i));page.append(b);group.push(b);
 });
 spots.push(group);
});
let voices=[],token=0,current=-1,mode="idle";
const omarAudio=$("#omarAudio"),adnanAudio=$("#adnanAudio");
const omarRanges={1:[0.256,1.30],3:[1.664,7.92],5:[8.491,21.14],7:[21.816,38.65]};
const adnanRanges={0:[0.299,2.197],2:[2.56,3.712],4:[4.096,4.864],6:[5.12,6.15]};
const speed=$("#speed"),speedValue=$("#speedValue");
speed.addEventListener("input",()=>{speedValue.value=Number(speed.value).toFixed(1)+"×";speedValue.textContent=speedValue.value;omarAudio.playbackRate=Number(speed.value);adnanAudio.playbackRate=Number(speed.value);});
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));}
function scoreVoice(v,role){
 const n=(v.name+" "+v.voiceURI).toLowerCase();let s=0;
 if(/enhanced|premium|natural|neural|online/.test(n))s+=40;
 if(/compact|default|basic/.test(n))s-=15;
 if(role==="Omar"&&/daniel|alex|oliver|aaron|evan|nathan|thomas|tom|david|guy|arthur|fred|male/.test(n))s+=30;
 if(role==="Adnan"&&/samantha|ava|zoe|serena|karen|female/.test(n))s+=20;
 if(/en-us|en-gb/.test(v.lang.toLowerCase()))s+=3;
 return s;
}
function chosenVoice(role){
 if(!voices.length)loadVoices();
 const ranked=[...voices].sort((a,b)=>scoreVoice(b,role)-scoreVoice(a,role));
 if(role==="Omar")return ranked[0];
 return ranked.find(v=>v.voiceURI!==chosenVoice("Omar")?.voiceURI)||ranked[0];
}
loadVoices();speechSynthesis.addEventListener?.("voiceschanged",loadVoices);
function controls(active){pauseBtn.disabled=!active;stopBtn.disabled=!active;pauseBtn.textContent="إيقاف مؤقت";}
function clearActive(){spots.flat().forEach(b=>b.classList.remove("active","selected"));}
function mark(i){clearActive();spots[i].forEach(b=>b.classList.add("active","selected"));status.textContent=lines[i][0]+" — الجملة "+(i+1);}
function finish(t,msg){if(t!==token)return;mode="idle";current=-1;clearActive();controls(false);status.textContent=msg;}
function say(i,t,onDone){
 current=i;mark(i);
 const isOmar=lines[i][0]==="Omar";
 const audio=isOmar?omarAudio:adnanAudio;
 const range=(isOmar?omarRanges:adnanRanges)[i];
 if(!range){finish(t,"تعذر تحديد مقطع الصوت.");return;}
 const end=range[1];
 audio.pause();audio.currentTime=range[0];audio.playbackRate=Number(speed.value);
 const tick=()=>{
  if(t!==token)return;
  if(audio.currentTime>=end){
   audio.pause();audio.removeEventListener("timeupdate",tick);onDone?.();
  }
 };
 audio.addEventListener("timeupdate",tick);
 audio.play().catch(()=>{
  audio.removeEventListener("timeupdate",tick);
  finish(t,"تعذر تحميل التسجيل الصوتي. تحقق من الاتصال ثم أعد المحاولة.");
 });
}
function stop(){token++;speechSynthesis.cancel();omarAudio.pause();adnanAudio.pause();mode="idle";current=-1;clearActive();controls(false);status.textContent="تم إيقاف الاستماع.";}
function speak(i){stop();const t=++token;mode="single";controls(true);say(i,t,()=>finish(t,"انتهى الاستماع إلى الجملة المحددة."));}
function play(){stop();const t=++token;let i=0;mode="all";controls(true);
 const next=()=>{if(t!==token)return;if(i>=lines.length){finish(t,"انتهت المحادثة كاملة.");return;}say(i,t,()=>{i++;next()});};next();
}
$("#play").addEventListener("click",play);stopBtn.addEventListener("click",stop);
pauseBtn.addEventListener("click",()=>{
 const paused=omarAudio.paused&&adnanAudio.paused&&!speechSynthesis.paused;
 if(paused){
  if(current>=0&&lines[current][0]==="Omar")omarAudio.play().catch(()=>{});
  else if(current>=0)adnanAudio.play().catch(()=>{});
  else speechSynthesis.resume();
  pauseBtn.textContent="إيقاف مؤقت";status.textContent="تمت متابعة الاستماع.";
 }else{
  omarAudio.pause();adnanAudio.pause();speechSynthesis.pause();
  pauseBtn.textContent="متابعة";status.textContent="الصوت متوقف مؤقتًا.";
 }
});
</script></body></html>
