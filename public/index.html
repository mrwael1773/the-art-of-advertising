<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1423">
  <meta name="description" content="صفحة The World of Plastic الأصلية مع تظليل الجمل والكلمات والاستماع والترجمة.">
  <title>The World of Plastic | صفحة القراءة</title>
  <link rel="stylesheet" href="./styles.css?v=11">
</head>
<body class="textbook-body">
  <main class="shell textbook-shell standalone-page">
    <section class="textbook-interaction" aria-label="صفحة القراءة التفاعلية">
      <div class="speed-control">
        <label for="speech-speed">سرعة النطق</label>
        <input id="speech-speed" type="range" min="0.25" max="1" step="0.05" value="0.85">
        <output id="speed-value" for="speech-speed">0.85×</output>
      </div>
      <p id="lesson-message" class="message" role="status" aria-live="polite"></p>
      <div id="textbook-page" class="textbook-image-stage" aria-label="صفحة الكتاب The World of Plastic"></div>
      <section id="textbook-selection" class="textbook-selection" aria-live="polite" hidden>
        <p id="textbook-selection-label" class="textbook-selection-label"></p>
        <div class="textbook-action-buttons">
          <button id="textbook-listen" class="mini-button" type="button">سماع</button>
          <button id="textbook-translate" class="mini-button" type="button">ترجمة</button>
        </div>
        <p id="textbook-translation" class="textbook-translation" hidden></p>
      </section>
    </section>
    <nav class="standalone-practice-link" aria-label="التمارين">
      <a href="./quiz.html">الانتقال إلى التمارين</a>
    </nav>
  </main>
  <script src="./page60-hotspots.js?v=11" defer></script>
  <script src="./lesson.js?v=11" defer></script>
</body>
</html>
