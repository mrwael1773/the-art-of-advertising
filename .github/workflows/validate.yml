name: Project checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/local-progress-clean]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/worker.js
          node --check public/app.js
          node --check public/progress-store.js
          node --check public/lesson.js
          node --check public/audio.js
          node --check tests/browser-smoke.mjs
      - name: Run local progress and security tests
        run: node --test tests/validate.mjs
      - name: Install pinned browser test runtime
        run: npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3
      - name: Install Chromium for browser smoke tests
        run: npx playwright install chromium
      - name: Test local student flows in Chromium
        run: node tests/browser-smoke.mjs
