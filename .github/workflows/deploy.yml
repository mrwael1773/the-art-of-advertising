name: Deploy The Art of Advertising

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: the-art-of-advertising-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
          printf '%s' "$CLOUDFLARE_D1_DATABASE_ID" | grep -Eq '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$' || { echo "::error::CLOUDFLARE_D1_DATABASE_ID must be a UUID stored as a repository secret."; exit 1; }
      - name: Prepare temporary production configuration
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const source = readFileSync("wrangler.toml", "utf8");
          const marker = 'database_id = "REPLACE_WITH_D1_DATABASE_ID"';
          if (source.split(marker).length !== 2) {
            throw new Error("Expected exactly one D1 database ID placeholder in wrangler.toml");
          }
          const id = process.env.CLOUDFLARE_D1_DATABASE_ID || "";
          if (!/^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$/.test(id)) {
            throw new Error("Invalid D1 database ID");
          }
          writeFileSync("wrangler.deploy.toml", source.replace(marker, `database_id = "${id}"`), { mode: 0o600 });
          NODE
      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.159.0 d1 migrations apply the-art-of-advertising --remote --config wrangler.deploy.toml
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.159.0 deploy --config wrangler.deploy.toml
      - name: Remove temporary production configuration
        if: always()
        run: rm -f wrangler.deploy.toml
