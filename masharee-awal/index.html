<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المحادثة التفاعلية - صفحة 59</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#f3f5f8;color:#172033;font-family:system-ui,Tahoma,sans-serif}
main{max-width:850px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:1.2rem}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 15px;background:#155e75;color:white;cursor:pointer}
.secondary{background:#e2e8f0;color:#172033}button:disabled{opacity:.45;cursor:not-allowed}
.page{position:relative;max-width:790px;margin:auto;background:white;line-height:0;box-shadow:0 8px 24px #0001;overflow:hidden}
.page img{width:100%;height:auto;display:block}.hot{position:absolute;border:2px solid transparent;border-radius:5px;background:transparent;padding:0;min-width:0;min-height:0}
.hot:focus-visible{outline:3px solid #2563eb;outline-offset:1px}.word-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.word-highlight{fill:rgba(35,35,35,.24);stroke:none;rx:2}
.status{max-width:790px;margin:12px auto;padding:12px;background:white;border-radius:10px;color:#475569;line-height:1.6}
.note{font-size:.88rem;color:#64748b;margin:8px 0}
</style></head>
<body><main>
<header><h1>المحادثة التفاعلية</h1><b>صفحة 59</b></header>
<div class="controls">
<button id="play">▶ استمع إلى المحادثة</button>
<button class="secondary" id="pause" disabled>إيقاف مؤقت</button>
<button class="secondary" id="stop" disabled>إيقاف</button>
</div>
<div class="page" id="page"><img src="conversation-page-59.jpg" alt="صفحة الكتاب الأصلية للمحادثة" onerror="document.querySelector('#status').textContent='تعذر تحميل صورة الصفحة. تحقق من الاتصال ثم أعد تحميل الموقع.'"></div>
<div class="status" id="status" aria-live="polite">اضغط زر الاستماع أو اضغط على موضع جملة في الصفحة لسماعها وحدها.</div>
<p class="note">يُخصص صوت إنجليزي مستقل لكل شخصية عند توفر صوتين مختلفين في الجهاز. إذا كان الجهاز يوفر صوتًا واحدًا فقط فسيظهر تنبيه، ولن ندّعي أن الصوتين مختلفان فعليًا.</p>
</main>
<script>
const lines=[
["Adnan","Hi, Omar. What are you up to?",[13,16.9,62,2.1],171],
["Omar","I'm turning off my alarm.",[13,18.9,62,2.0],190],
["Adnan","What on earth is that?",[13,20.9,62,2.0],210],
["Omar","It's the new flying helicopter alarm. It runs on rechargeable batteries! It's the best alarm clock I've ever had.",[13,22.8,64,4.7],229],
["Adnan","How does it work?",[13,28.5,62,2.0],263],
["Omar","You see, the top part, in other words the flying part, is placed on a base. The alarm is set and when it goes off the top part flies off the base. It is made to fly in order to make you get up, catch it, and put it back on its base.",[13,30.4,64,6.5],282],
["Adnan","And why is it here?",[13,36.7,62,2.0],348],
["Omar","Well, you know how it is when you have a lot to do at work and you also have to attend meetings. I don't have an assistant so if I am working on an important project I forget. The flying alarm can solve the problem. I set it in time for any meeting or conference that I have and I don't have to worry. What do you think?",[13,38.5,64,7.0],367]
];
const $=s=>document.querySelector(s),page=$("#page"),status=$("#status"),pauseBtn=$("#pause"),stopBtn=$("#stop"),spots=[];
const svgNS="http://www.w3.org/2000/svg",W=790,H=1024,START_X=153;
const svg=document.createElementNS(svgNS,"svg");svg.setAttribute("class","word-layer");svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("preserveAspectRatio","none");page.append(svg);
const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");ctx.font="12px Arial";
const wordRects=[];
function detectPrintedRows(){
 const img=page.querySelector("img");
 if(!img?.complete||!img.naturalWidth)return [];
 canvas.width=W;canvas.height=H;ctx.font="12px Arial";
 try{ctx.drawImage(img,0,0,W,H);}catch{return [];}
 const pixels=ctx.getImageData(0,0,W,H).data,active=[];
 for(let y=175;y<475;y++){
  let count=0;
  for(let x=98;x<600;x++){
   const p=(y*W+x)*4,lum=.299*pixels[p]+.587*pixels[p+1]+.114*pixels[p+2];
   if(pixels[p+3]>0&&lum<155)count++;
  }
  if(count>=3)active.push(y);
 }
 const groups=[];
 for(const y of active){
  const last=groups[groups.length-1];
  if(!last||y-last.bottom>3)groups.push({top:y,bottom:y});
  else last.bottom=y;
 }
 return groups.filter(g=>g.bottom-g.top<=16);
}
function buildWordRectsFromImage(){
 const expected=[1,1,1,2,1,3,1,5],rows=detectPrintedRows();
 if(rows.length!==15)return false;
 let chosenLayouts=null;
 for(let width=390;width<=470;width++){
  const layouts=lines.map(line=>{
   const matches=[...line[1].matchAll(/[A-Za-z]+(?:['’][A-Za-z]+)?/g)];
   const result=[];let row=[],used=0;
   for(const m of matches){
    const w=ctx.measureText(m[0]).width,space=row.length?ctx.measureText(" ").width:0;
    if(row.length&&used+space+w>width){result.push(row);row=[];used=0;}
    row.push(m);used+=(row.length>1?space:0)+w;
   }
   if(row.length)result.push(row);
   return result;
  });
  if(layouts.every((layout,i)=>layout.length===expected[i])){chosenLayouts=layouts;break;}
 }
 if(!chosenLayouts)return false;
 let rowIndex=0;
 chosenLayouts.forEach((layout,lineIndex)=>{
  layout.forEach(row=>{
   let x=START_X;
   row.forEach((m,j)=>{
    if(j)x+=ctx.measureText(" ").width;
    const width=ctx.measureText(m[0]).width,r=document.createElementNS(svgNS,"rect");
    r.setAttribute("class","word-highlight");r.setAttribute("x",x.toFixed(1));
    r.setAttribute("y",(rows[rowIndex].top-1).toFixed(1));
    r.setAttribute("width",Math.max(4,width).toFixed(1));
    r.setAttribute("height",Math.max(11,rows[rowIndex].bottom-rows[rowIndex].top+3).toFixed(1));
    r.style.display="none";svg.append(r);
    wordRects.push({line:lineIndex,start:m.index,end:m.index+m[0].length,rect:r});
    x+=width;
   });
   rowIndex++;
  });
 });
 return true;
}
function buildWordRectsFallback(line,index){
 const matches=[...line[1].matchAll(/[A-Za-z]+(?:['’][A-Za-z]+)?/g)];
 let x=START_X,y=line[3],row=[],used=0;
 const add=(items,top)=>{let xx=START_X;items.forEach((m,j)=>{if(j)xx+=ctx.measureText(" ").width;const r=document.createElementNS(svgNS,"rect");r.setAttribute("class","word-highlight");r.setAttribute("x",xx);r.setAttribute("y",top-1);r.setAttribute("width",ctx.measureText(m[0]).width);r.setAttribute("height",13);r.style.display="none";svg.append(r);wordRects.push({line:index,start:m.index,end:m.index+m[0].length,rect:r});xx+=ctx.measureText(m[0]).width;});};
 for(const m of matches){const w=ctx.measureText(m[0]).width,space=row.length?ctx.measureText(" ").width:0;if(row.length&&used+space+w>438){add(row,y);y+=17;row=[];used=0;}row.push(m);used+=(row.length>1?space:0)+w;}
 if(row.length)add(row,y);
}
function setupHighlights(){
 if(buildWordRectsFromImage())status.textContent="تمت مطابقة مواضع الكلمات مع أسطر الصفحة الأصلية.";
 else{wordRects.splice(0);svg.replaceChildren();lines.forEach(buildWordRectsFallback);status.textContent="تعذر قراءة مواضع النص من الصورة؛ يعمل التظليل بالمواضع الاحتياطية.";}
}
const pageImage=page.querySelector("img");
if(pageImage.complete)setupHighlights();else pageImage.addEventListener("load",setupHighlights,{once:true});
lines.forEach((line,i)=>{const b=document.createElement("button");b.type="button";b.className="hot";b.setAttribute("aria-label","تشغيل جملة "+(i+1)+" — "+line[0]);const [x,y,w,h]=line[2];Object.assign(b.style,{left:x+"%",top:y+"%",width:w+"%",height:h+"%"});b.addEventListener("click",()=>speak(i));page.append(b);spots.push(b);});
let voices=[],token=0,current=-1,mode="idle";
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));}
loadVoices();speechSynthesis.addEventListener?.("voiceschanged",loadVoices);
function controls(active){pauseBtn.disabled=!active;stopBtn.disabled=!active;pauseBtn.textContent="إيقاف مؤقت";}
function clearActive(){wordRects.forEach(x=>x.rect.style.display="none");}
function mark(i){spots.forEach((b,n)=>b.classList.toggle("active",n===i));status.textContent=lines[i][0]+" — الجملة "+(i+1);}
function markWord(i,charIndex){
 const candidates=wordRects.filter(x=>x.line===i);
 let found=candidates.find(x=>charIndex>=x.start&&charIndex<x.end);
 if(!found)found=candidates.find(x=>x.start>=charIndex);
 if(!found)return;
 candidates.forEach(x=>x.rect.style.display=x===found?"":"none");
}
function finish(t,msg){if(t!==token)return;mode="idle";current=-1;clearActive();spots.forEach(b=>b.classList.remove("active"));controls(false);status.textContent=msg;}
function say(i,t,onDone){
 current=i;const u=new SpeechSynthesisUtterance(lines[i][1]);const v=lines[i][0]==="Adnan"?voices[0]:(voices.find(x=>x.voiceURI!==voices[0]?.voiceURI)||voices[0]);
 if(v)u.voice=v;u.lang=v?.lang||"en-US";u.rate=.88;u.pitch=i%2?1.08:1;
 u.onstart=()=>{if(t===token){clearActive();mark(i);markWord(i,0)}};
 u.onboundary=e=>{if(t===token&&e.name==="word")markWord(i,e.charIndex)};
 u.onend=()=>{if(t===token)onDone?.()};
 u.onerror=()=>{if(t===token)finish(t,"تعذر تشغيل الصوت. تحقق من دعم المتصفح للنطق.")};
 speechSynthesis.speak(u);
}
function stop(){token++;speechSynthesis.cancel();mode="idle";current=-1;clearActive();spots.forEach(b=>b.classList.remove("active"));controls(false);status.textContent="تم إيقاف الاستماع.";}
function speak(i){stop();const t=++token;mode="single";controls(true);say(i,t,()=>finish(t,"انتهى الاستماع إلى الجملة المحددة."));}
function play(){stop();const t=++token;let i=0;mode="all";controls(true);const next=()=>{if(t!==token)return;if(i>=lines.length){finish(t,"انتهت المحادثة كاملة.");return;}say(i,t,()=>{i++;next()});};next();}
$("#play").addEventListener("click",play);stopBtn.addEventListener("click",stop);
pauseBtn.addEventListener("click",()=>{if(speechSynthesis.paused){speechSynthesis.resume();pauseBtn.textContent="إيقاف مؤقت";status.textContent="تمت متابعة الاستماع.";}else if(speechSynthesis.speaking){speechSynthesis.pause();pauseBtn.textContent="متابعة";status.textContent="الصوت متوقف مؤقتًا.";}});
</script></body></html>
